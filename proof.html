<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emma's Proof</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap">
<style>
:root {
  --bg: #fbf6ff; --bg2: #ffeef6; --bg3: #eaf4ff; --card: #ffffff; --fg: #2b2440; --muted: #8a81a3; --line: #eee6f8;
  --test: #ff6b8a; --test-bg: #ffe6ec; --school: #2fbf8f; --school-bg: #dff7ee;
  --hunter: #9b6bff; --hunter-bg: #efe7ff; --rsm: #3d8bff; --rsm-bg: #e3eeff;
  --fixed: #8a84a3; --fixed-bg: #efedf5; --flex: #f0a516; --flex-bg: #fff3d9;
  --accent: #9b6bff; --shadow: 0 10px 30px rgba(120, 90, 180, .14);
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
  --hand: "Caveat", "Bradley Hand", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #16122a; --bg2: #26162e; --bg3: #14203a; --card: #221d38; --fg: #f3efff; --muted: #a89fc4; --line: #322b4d;
  --test: #ff8aa3; --test-bg: #3b1d2b; --school: #4fdcaa; --school-bg: #163229;
  --hunter: #b996ff; --hunter-bg: #2c2148; --rsm: #74abff; --rsm-bg: #1c2848;
  --fixed: #aaa4c2; --fixed-bg: #2a2640; --flex: #ffc24d; --flex-bg: #3a2e14;
  --accent: #b996ff; --shadow: 0 10px 30px rgba(0,0,0,.35); color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45;
  background: var(--bg); background-image: radial-gradient(circle at 0% 0%, var(--bg2) 0, transparent 40%), radial-gradient(circle at 100% 20%, var(--bg3) 0, transparent 40%), radial-gradient(circle at 50% 100%, var(--bg2) 0, transparent 45%); background-attachment: fixed; }
.wrap { max-width: 920px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 72px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 22px; }
header { display: grid; gap: 10px; }
.kicker { font-family: var(--display); font-weight: 600; font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2.3rem, 8vw, 3.4rem); line-height: 1; margin: 0; }
h1 span { font-family: var(--hand); font-weight: 700; color: var(--test); font-size: 1.1em; }
.sub { margin: 0; color: var(--muted); }
.back { justify-self: start; font-weight: 800; color: var(--accent); text-decoration: none; font-size: .95rem; }
.days { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.daybtn { flex: none; font: inherit; border: 0; cursor: pointer; background: var(--card); color: var(--fg); border-radius: 18px; padding: 10px 14px; box-shadow: var(--shadow); display: grid; gap: 0; text-align: left; min-width: 92px; }
.daybtn b { font-family: var(--display); font-weight: 600; font-size: 1rem; }
.daybtn small { color: var(--muted); font-size: .78rem; font-weight: 700; }
.daybtn[aria-pressed="true"] { background: var(--accent); color: #fff; }
.daybtn[aria-pressed="true"] small { color: rgba(255,255,255,.85); }
.daybtn:focus-visible, .polaroid:focus-visible, .lb button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--card); border-radius: 99px; padding: 7px 14px; font-weight: 800; font-size: .88rem; box-shadow: var(--shadow); }
.chip em { font-style: normal; color: var(--accent); font-family: var(--display); font-size: 1rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 155px), 1fr)); gap: 20px 14px; }
.polaroid { font: inherit; color: inherit; text-align: left; border: 0; cursor: pointer; background: var(--card); border-radius: 6px; padding: 9px 9px 14px; box-shadow: var(--shadow); display: grid; gap: 10px; transition: transform .2s ease; }
.grid > :nth-child(3n+1) { transform: rotate(-1.2deg); }
.grid > :nth-child(3n+2) { transform: rotate(.9deg); }
.grid > :nth-child(3n) { transform: rotate(-.4deg); }
.polaroid:hover { transform: rotate(0) translateY(-3px); }
.pic { aspect-ratio: 1; border-radius: 3px; background: var(--line); overflow: hidden; display: grid; place-items: center; position: relative; }
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic .loading { font-family: var(--hand); font-size: 1.3rem; color: var(--muted); }
.nopic { aspect-ratio: 1; border-radius: 3px; background: var(--cb); display: grid; place-items: center; padding: 18px; text-align: center; background-image: repeating-linear-gradient(transparent 0 30px, rgba(155,107,255,.15) 30px 31px); }
.nopic span { font-family: var(--hand); font-size: 1.3rem; line-height: 1.15; color: var(--fg); }
.nopic small { display: block; font-family: var(--body); font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--c); margin-bottom: 8px; }
.cap { display: grid; gap: 3px; padding: 0 4px; }
.cap .t { font-family: var(--hand); font-weight: 700; font-size: 1.45rem; line-height: 1.05; }
.cap .m { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); font-weight: 700; flex-wrap: wrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; }
.cap q { font-size: .9rem; color: var(--fg); opacity: .85; quotes: "\201C" "\201D"; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c-test { --c: var(--test); --cb: var(--test-bg); } .c-school { --c: var(--school); --cb: var(--school-bg); }
.c-hunter { --c: var(--hunter); --cb: var(--hunter-bg); } .c-rsm { --c: var(--rsm); --cb: var(--rsm-bg); }
.c-fixed { --c: var(--fixed); --cb: var(--fixed-bg); } .c-flex { --c: var(--flex); --cb: var(--flex-bg); }
.open { background: var(--card); border-radius: 20px; padding: 16px 18px; box-shadow: var(--shadow); display: grid; gap: 8px; }
.open h2 { font-family: var(--display); font-size: 1.1rem; margin: 0; }
.open ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.open li { background: var(--cb); color: var(--fg); border-radius: 99px; padding: 5px 12px; font-size: .85rem; font-weight: 700; }
.empty { text-align: center; padding: 40px 10px; color: var(--muted); }
.empty b { display: block; font-family: var(--hand); font-size: 2rem; color: var(--fg); }
.status { text-align: center; color: var(--muted); font-size: .9rem; margin: 0; }
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(18, 12, 34, .95); display: grid; grid-template-rows: 1fr auto; padding: max(14px, env(safe-area-inset-top, 0px)) 14px max(14px, env(safe-area-inset-bottom, 0px)); }
.lb[hidden] { display: none; }
.lb .stage { display: grid; place-items: center; min-height: 0; position: relative; }
.lb img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); background: #fff; }
.lb .note { color: #fff; text-align: center; padding: 14px 8px 4px; display: grid; gap: 4px; }
.lb .note b { font-family: var(--hand); font-size: 1.9rem; line-height: 1; }
.lb .note span { opacity: .85; font-size: .95rem; }
.lb .note a { color: #d9c7ff; font-weight: 700; font-size: .85rem; }
.lb button { position: absolute; border: 0; background: rgba(30,22,52,.75); color: #fff; box-shadow: 0 0 0 1.5px rgba(255,255,255,.35); width: 44px; height: 44px; border-radius: 50%; font-size: 1.4rem; cursor: pointer; display: grid; place-items: center; }
.lb .x { top: 0; right: 0; } .lb .prev { left: 0; top: 50%; transform: translateY(-50%); } .lb .next { right: 0; top: 50%; transform: translateY(-50%); }
.live { border-radius: 22px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; background: var(--card); }
.live.on { background: linear-gradient(120deg, var(--school-bg), var(--card) 70%); outline: 2.5px solid var(--school); }
.live .pulse { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); opacity: .5; }
.live.on .pulse { background: var(--school); opacity: 1; box-shadow: 0 0 0 0 var(--school); animation: ring 1.8s ease-out infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(47,191,143,.55); } 100% { box-shadow: 0 0 0 14px rgba(47,191,143,0); } }
.live div { display: grid; gap: 1px; min-width: 0; }
.live small { font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.live.on small { color: var(--school); }
.live b { font-family: var(--hand); font-size: 1.7rem; line-height: 1.05; }
.live span { color: var(--muted); font-size: .88rem; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .live.on .pulse { animation: none; } }
.setup { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); }
@media (prefers-reduced-motion: reduce) { .polaroid, .grid > * { transition: none; transform: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="./">← Back to the checklist</a>
    <span class="kicker" id="kicker">Proof board</span>
    <h1>Emma's <span>proof</span></h1>
    <p class="sub">Every finished assignment with her picture or note. Tap one to see it big.</p>
  </header>
  <section class="live" id="live" aria-live="polite"><i class="pulse"></i><div><small id="liveLabel">Checking…</small><b id="liveTitle"></b><span id="liveSub"></span></div></section>
  <nav class="days" id="days" aria-label="Pick a day"></nav>
  <div class="summary" id="summary"></div>
  <section class="grid" id="grid"></section>
  <section class="open" id="open" hidden><h2>Not checked off yet</h2><ul id="openList"></ul></section>
  <p class="status" id="status">Loading…</p>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo">
  <div class="stage"><img id="lbImg" alt=""><button class="x" id="lbX" aria-label="Close">×</button><button class="prev" id="lbPrev" aria-label="Previous">‹</button><button class="next" id="lbNext" aria-label="Next">›</button></div>
  <div class="note"><b id="lbTitle"></b><span id="lbText"></span><a id="lbDrive" target="_blank" rel="noopener">Open in Google Drive</a></div>
</div>

<script>
let API = null, KEY = null;
try {
  const h = location.hash;
  const a = h.match(/api=([^&]+)/), k = h.match(/key=([^&]+)/);
  if (a) localStorage.setItem("emma-hw-api", decodeURIComponent(a[1]));
  if (k) localStorage.setItem("emma-hw-sofia", decodeURIComponent(k[1]));
  if (a || k) history.replaceState(null, "", location.pathname);
  API = localStorage.getItem("emma-hw-api"); KEY = localStorage.getItem("emma-hw-sofia");
} catch (e) {}

const LABELS = { test: "Test prep", school: "School", hunter: "Hunter", rsm: "RSM", fixed: "Plan", flex: "Break" };
let data = null, day = null, shown = [], lbIndex = 0;
const imgCache = {};
const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function addDays(s, n) { const d = new Date(s + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dayLabel(s) {
  if (s === data.today) return "Today";
  if (s === addDays(data.today, -1)) return "Yesterday";
  return new Date(s + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
}
function shortDate(s) { return new Date(s + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }); }
function clock(iso) { return iso ? new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).toLowerCase().replace(" ", "") : ""; }
const url = q => API + (API.includes("?") ? "&" : "?") + q + "&key=" + encodeURIComponent(KEY) + "&t=" + Date.now();

async function load() {
  if (!API || !KEY) { $("status").textContent = "Open this page once with Sofia's special link to unlock it."; return; }
  try {
    const j = await (await fetch(url("review=1"))).json();
    if (!j.ok) throw new Error(j.error);
    data = j;
    const dates = [...new Set(j.tasks.map(t => t.date))].sort().reverse();
    if (!day || !dates.includes(day)) day = dates.includes(j.today) ? j.today : dates[0];
    renderDays(dates); render();
    $("status").textContent = "";
  } catch (e) { $("status").textContent = e.message === "not allowed" ? "This link isn't unlocked. Use Sofia's special link." : "Couldn't load. Check your internet and reload."; }
}
let live = null;
async function loadLive() {
  if (!API) return;
  try {
    const j = await (await fetch(API + (API.includes("?") ? "&" : "?") + "t=" + Date.now())).json();
    if (j.ok) { live = j; renderLive(); }
  } catch (e) {}
}
function mins(iso) { const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000)); return m < 60 ? m + " min" : Math.floor(m / 60) + " hr " + (m % 60) + " min"; }
function renderLive() {
  if (!live) return;
  const st = live.status, box = $("live");
  if (st && st.taskId) {
    box.classList.add("on");
    $("liveLabel").textContent = "Working right now";
    $("liveTitle").textContent = st.title;
    $("liveSub").textContent = "Started " + clock(st.startedAt) + " · " + mins(st.startedAt) + " so far";
  } else {
    box.classList.remove("on");
    $("liveLabel").textContent = "Not in a work session";
    const last = live.tasks.filter(t => t.done && t.doneAt && !(live.noProof || []).includes(t.cat)).sort((a, b) => b.doneAt.localeCompare(a.doneAt))[0];
    $("liveTitle").textContent = last ? "Last finished: " + last.title : "Nothing started yet";
    $("liveSub").textContent = last ? new Date(last.doneAt).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) : "";
  }
}
function renderDays(dates) {
  const nav = $("days"); nav.textContent = "";
  dates.forEach(d => {
    const n = data.tasks.filter(t => t.date === d && t.done && !data.noProof.includes(t.cat)).length;
    const b = el("button", "daybtn"); b.type = "button"; b.setAttribute("aria-pressed", d === day ? "true" : "false");
    b.append(el("b", null, dayLabel(d)), el("small", null, shortDate(d) + " · " + n + " done"));
    b.onclick = () => { day = d; renderDays(dates); render(); };
    nav.append(b);
  });
  $("kicker").textContent = dates.length ? shortDate(dates[dates.length - 1]) + " to " + shortDate(dates[0]) : "Proof board";
}
function render() {
  const all = data.tasks.filter(t => t.date === day);
  const hw = all.filter(t => !data.noProof.includes(t.cat));
  shown = hw.filter(t => t.done).sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt)));
  const photos = shown.filter(t => t.photoId).length;
  const sum = $("summary"); sum.textContent = "";
  [["done", shown.length + " of " + hw.length], ["with photos", photos], ["note only", shown.length - photos]].forEach(([l, v]) => {
    const c = el("span", "chip"); c.append(el("em", null, String(v)), document.createTextNode(" " + l)); sum.append(c);
  });
  const grid = $("grid"); grid.textContent = "";
  if (!shown.length) { const e = el("div", "empty"); e.append(el("b", null, "Nothing yet"), document.createTextNode("Finished work will pop up here.")); grid.append(e); }
  shown.forEach((t, i) => {
    const card = el("button", "polaroid c-" + t.cat); card.type = "button";
    card.setAttribute("aria-label", t.title + (t.photoId ? ", photo" : ", note"));
    if (t.photoId) {
      const pic = el("div", "pic"); pic.append(el("span", "loading", "developing…"));
      card.append(pic); loadImg(t.photoId).then(src => { if (src) { pic.textContent = ""; const im = el("img"); im.src = src; im.alt = "Emma's work for " + t.title; pic.append(im); } else pic.firstChild.textContent = "couldn't load"; });
    } else {
      const np = el("div", "nopic"); const s = el("span"); s.append(el("small", null, "No picture"), document.createTextNode(t.proofText || "(no note)")); np.append(s); card.append(np);
    }
    const cap = el("div", "cap");
    cap.append(el("span", "t", t.title));
    const m = el("span", "m"); m.append(el("i", "dot"), document.createTextNode(LABELS[t.cat] + " · " + clock(t.doneAt))); cap.append(m);
    if (t.photoId && t.proofText) cap.append(el("q", null, t.proofText));
    card.append(cap);
    card.onclick = () => openLb(i);
    grid.append(card);
  });
  const open = hw.filter(t => !t.done);
  $("open").hidden = !open.length;
  const ul = $("openList"); ul.textContent = "";
  open.forEach(t => ul.append(el("li", "c-" + t.cat, t.title)));
}
function loadImg(id) {
  if (!imgCache[id]) imgCache[id] = fetch(url("photo=" + encodeURIComponent(id))).then(r => r.json()).then(j => j.ok ? "data:" + j.type + ";base64," + j.data : null).catch(() => null);
  return imgCache[id];
}
async function openLb(i) {
  lbIndex = (i + shown.length) % shown.length; const t = shown[lbIndex];
  $("lb").hidden = false;
  $("lbTitle").textContent = t.title;
  $("lbText").textContent = [clock(t.doneAt), t.proofText ? "“" + t.proofText + "”" : (t.photoId ? "" : "No picture or note")].filter(Boolean).join(" · ");
  $("lbDrive").hidden = !t.proofPhoto; $("lbDrive").href = t.proofPhoto || "#";
  const img = $("lbImg");
  img.hidden = !t.photoId; img.removeAttribute("src");
  if (t.photoId) { const src = await loadImg(t.photoId); if (shown[lbIndex] === t && src) img.src = src; }
  $("lbPrev").hidden = $("lbNext").hidden = shown.length < 2;
  $("lbX").focus();
}
function closeLb() { $("lb").hidden = true; }
$("lbX").onclick = closeLb;
$("lbPrev").onclick = () => openLb(lbIndex - 1);
$("lbNext").onclick = () => openLb(lbIndex + 1);
$("lb").addEventListener("click", e => { if (e.target === $("lb") || e.target.classList.contains("stage")) closeLb(); });
document.addEventListener("keydown", e => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") closeLb(); else if (e.key === "ArrowLeft") openLb(lbIndex - 1); else if (e.key === "ArrowRight") openLb(lbIndex + 1);
});
let sx = null;
$("lb").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
$("lb").addEventListener("touchend", e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) openLb(lbIndex + (dx < 0 ? 1 : -1)); sx = null; });
load(); loadLive();
setInterval(() => { if ($("lb").hidden && !document.hidden) load(); }, 60000);
setInterval(() => { if (!document.hidden) loadLive(); }, 20000);
setInterval(renderLive, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadLive(); load(); } });
</script>
</body>
</html>
